<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متجر الشحن الفوري</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f8;--ink:#1b1f3b;--muted:#5d6385;--card:#fff;--accent:#5b3df5;--accent-ink:#fff;--line:#d9ddef;--ok:#127a4b}
@media (prefers-color-scheme:dark){:root{--bg:#14162b;--ink:#eceefb;--muted:#a1a7cf;--card:#1e2142;--accent:#8c78ff;--accent-ink:#14162b;--line:#32366a;--ok:#4cd29a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;line-height:1.6}
main{max-width:960px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:clamp(28px,7vw,44px);font-weight:800;margin:8px 0 4px;line-height:1.2}
.sub{color:var(--muted);margin:0 0 20px}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#cats{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;justify-content:space-between}
.p small{color:var(--muted)}
.p b{font-weight:500}
.price{font-size:24px;font-weight:800;color:var(--accent)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
dialog{border:0;border-radius:16px;padding:20px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,12,30,.55)}
dialog form{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px}
#track{margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
#track h2{font-size:20px;margin:0 0 10px}
#res{margin-top:12px}
code{display:block;direction:ltr;text-align:left;background:var(--bg);border:1px dashed var(--accent);border-radius:10px;padding:12px;margin:8px 0;word-break:break-all;font-size:18px}
.ok{color:var(--ok);font-weight:800}
</style>
</head>
<body>
<main>
  <h1>شحن ألعاب وتطبيقات، يصلك الكود فورًا</h1>
  <p class="sub">اختر المنتج، أكمل الدفع، واستلم الكود هنا في صفحة طلبك.</p>
  <input id="q" type="search" placeholder="ابحث: PUBG، Google Play، Steam…" aria-label="بحث">
  <div id="cats"></div>
  <div id="grid" aria-live="polite">جارٍ تحميل المنتجات…</div>

  <section id="track">
    <h2>تتبّع طلبك</h2>
    <div class="row"><input id="oid" placeholder="رقم الطلب"><button class="btn" id="chk">تحقق</button></div>
    <div id="res"></div>
  </section>
</main>

<dialog id="dlg">
  <form method="dialog" id="f">
    <b id="dn"></b>
    <span class="price" id="dp"></span>
    <input id="contact" placeholder="واتساب أو تلغرام للتواصل" required maxlength="100">
    <div id="msg" role="status"></div>
    <div class="row"><button class="btn" id="go" type="button">تأكيد الطلب</button><button class="btn alt" value="cancel">إغلاق</button></div>
  </form>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS = { pending: 'بانتظار تأكيد الدفع', processing: 'جارٍ التنفيذ', delivered: 'تم التسليم' };
let products = [], cat = 'الكل', term = '', cur = null;

async function load() {
  try {
    products = await (await fetch('/api/products')).json();
    if (!Array.isArray(products)) throw 0;
    render();
  } catch { $('#grid').textContent = 'تعذّر تحميل المنتجات. أعد تحميل الصفحة بعد قليل.'; }
}
function render() {
  const cats = ['الكل', ...new Set(products.map((p) => p.category))];
  $('#cats').innerHTML = cats.map((c) => `<button class="chip ${c === cat ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  const list = products.filter((p) => (cat === 'الكل' || p.category === cat) && p.name.toLowerCase().includes(term));
  $('#grid').innerHTML = list.length
    ? list.map((p) => `<div class="p"><div><small>${esc(p.category)}</small><br><b>${esc(p.name)}</b></div><span class="price">$${p.price.toFixed(2)}</span><button class="btn" data-id="${esc(p.id)}">اطلب الآن</button></div>`).join('')
    : 'لا توجد نتائج. جرّب كلمة أخرى.';
}
$('#q').oninput = (e) => { term = e.target.value.trim().toLowerCase(); render(); };
$('#cats').onclick = (e) => { if (e.target.dataset.c) { cat = e.target.dataset.c; render(); } };
$('#grid').onclick = (e) => {
  const id = e.target.dataset.id; if (!id) return;
  cur = products.find((p) => String(p.id) === id);
  $('#dn').textContent = cur.name; $('#dp').textContent = '$' + cur.price.toFixed(2);
  $('#msg').textContent = ''; $('#go').disabled = false; $('#dlg').showModal();
};
$('#go').onclick = async () => {
  const contact = $('#contact').value.trim();
  if (!contact) { $('#msg').textContent = 'أدخل وسيلة التواصل أولًا.'; return; }
  $('#go').disabled = true;
  try {
    const r = await fetch('/api/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ productId: cur.id, contact }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    localStorage.setItem('lastOrder', d.id);
    $('#msg').innerHTML = `<span class="ok">تم إنشاء الطلب</span><code>${esc(d.id)}</code>${esc(d.paymentNote)}`;
    $('#oid').value = d.id;
  } catch (e) { $('#msg').textContent = e.message || 'تعذّر إنشاء الطلب. حاول مرة أخرى.'; $('#go').disabled = false; }
};
async function check() {
  const id = $('#oid').value.trim(); if (!id) return;
  const r = await fetch('/api/orders/' + encodeURIComponent(id)); const d = await r.json();
  $('#res').innerHTML = !r.ok ? esc(d.error)
    : `${esc(d.name)} — <b>${STATUS[d.status] || esc(d.status)}</b>` + (d.code ? `<code>${esc(d.code)}</code>` : '');
}
$('#chk').onclick = check;
$('#oid').value = localStorage.getItem('lastOrder') || '';
load();
</script>
</body>
</html>
